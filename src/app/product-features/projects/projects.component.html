<mat-accordion [multi]="true">
  <mat-expansion-panel [expanded]="true">

      <mat-panel-title>
        <img [src]="evImagePathOrUrl" class="stepper-icon" alt="EdgeVerve">

      <mat-panel-description>Jan. 2026 - Present</mat-panel-description>
    </mat-expansion-panel-header>
      <dkm-edgeverve-experience></dkm-edgeverve-experience>

  <mat-expansion-panel [expanded]="true">

  <mat-expansion-panel [expanded]="true">

      <mat-panel-title>
