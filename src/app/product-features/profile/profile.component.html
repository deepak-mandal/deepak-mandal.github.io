<a href="{{demoServer}}" target="_blank" class="fixed-resume-button">
  <mat-icon>dns</mat-icon>
</a>

<div style="margin-bottom: 10px;">
  <mat-card>
    <mat-card-header>
      <div mat-card-avatar [ngStyle]="{'background-image': 'url(' + profilePath + ')', 'background-size': 'cover'  }"
        role="img" aria-label="Deepak Mandal">
      </div>
      <mat-card-title>
        <h1 style="font: 20px Roboto, sans-serif; margin: 0px; font-weight: 500;">
          Deepak Mandal
        </h1>
      </mat-card-title>
      <mat-card-subtitle>
        {{profileSubTitle}}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      @if (totalExperiences>0) {
      <span>{{totalExperiences}} years of </span>
      }Professional experience in software engineering including significant expertise in Java technologies, SQL, Spring
      & Angular framework; with strong engineering Academic background from IIT Guwahati.
    </mat-card-content>
  </mat-card>
</div>
